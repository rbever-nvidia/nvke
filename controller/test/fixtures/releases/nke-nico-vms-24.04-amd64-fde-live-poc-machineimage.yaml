apiVersion: internal.nke.nvidia.com/v1
kind: MachineImage
metadata:
  name: nke-nico-vms-24.04-amd64-fde-live-poc
spec:
  operatingSystem:
    family: ubuntu
    version: "24.04"
  architecture: amd64
  buildDate: "2026-03-23"
  nico:
    ipxeScript: |
      #!ipxe
      # FIXME: POC - this live-test fixture intentionally uses the same CloudFront
      # artifacts as the existing nico-vms cluster on Colossus. Replace this with
      # generated fleet release manifests from nke-site-deploy when they exist.
      set boot-loader https://d1veq6e8nuk2fy.cloudfront.net/nke-isos/qcow/efi/x86_64/2026-06-02/1780426045/qcow-imager.efi
      set image-url https://d1veq6e8nuk2fy.cloudfront.net/nke-packages/os-image/releases/v0.1.0-rc.8/amd64/nke-node-fde-ubuntu-24.04.5-amd64.qcow2
      set disk-strategy {{ .DiskSelectionStrategy }}

      # You probably don't need to change these
      set console-config console=tty0 console=ttyS1,115200
      set kernel-params pci=realloc=off reboot=pci loglevel=1 iommu=pt intel_iommu=on
      set luks-key luks.key=changeit
      set cloud-init-ds ds=nocloud-net;s=${cloudinit-url}

      chain ${boot-loader} ${console-config} ${kernel-params} ${luks-key} image_url=${image-url} disk_strategy=${disk-strategy} ${cloud-init-ds} update_grub_template=yes update_grub_cfg=yes
      boot
