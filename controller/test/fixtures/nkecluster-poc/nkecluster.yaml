#
# Local nico-sim container site from controller/nico-sim/internal/seed/default-seed.yaml.
# That site has one instance type, nico-container-node, and one subnet. It has no VPC prefix.
# The nico-vms classes below are the VM site sizes and stay available for that backend.
---
apiVersion: internal.nke.nvidia.com/v1
kind: MachineClass
metadata:
  name: nico-vms-cpu2-mem2gb-disk30gb
spec:
  provider: nico
  nico:
    instanceTypeID: a1b2c3d4-0005-4000-8000-000000000001
  kubelet:
    systemReservedMemory: 512Mi
    kubeReservedMemory: 512Mi
---
apiVersion: internal.nke.nvidia.com/v1
kind: MachineClass
metadata:
  name: nico-vms-cpu2-mem4gb-disk30gb
spec:
  provider: nico
  nico:
    instanceTypeID: a1b2c3d4-0005-4000-8000-000000000002
  kubelet:
    systemReservedMemory: 1Gi
    kubeReservedMemory: 512Mi
---
apiVersion: internal.nke.nvidia.com/v1
kind: MachineClass
metadata:
  name: nico-vms-cpu2-mem4gb-disk50gb
spec:
  provider: nico
  nico:
    instanceTypeID: a1b2c3d4-0005-4000-8000-000000000005
  kubelet:
    systemReservedMemory: 1Gi
    kubeReservedMemory: 512Mi
---
apiVersion: internal.nke.nvidia.com/v1
kind: MachineClass
metadata:
  name: nico-vms-cpu4-mem6gb-disk60gb
spec:
  provider: nico
  nico:
    instanceTypeID: a1b2c3d4-0005-4000-8000-000000000003
  kubelet:
    systemReservedMemory: 1Gi
    kubeReservedMemory: 512Mi
---
apiVersion: internal.nke.nvidia.com/v1
kind: MachineClass
metadata:
  name: nico-vms-cpu6-mem32gb-disk60gb
spec:
  provider: nico
  nico:
    instanceTypeID: a1b2c3d4-0005-4000-8000-000000000004
  kubelet:
    systemReservedMemory: 16Gi
    kubeReservedMemory: 2Gi
---
apiVersion: internal.nke.nvidia.com/v1
kind: MachineClass
metadata:
  name: nico-container-node
spec:
  provider: nico
  nico:
    instanceTypeID: 00000000-0000-0000-0000-000000000005
  kubelet:
    systemReservedMemory: 512Mi
    kubeReservedMemory: 256Mi
---
apiVersion: internal.nke.nvidia.com/v1
kind: ControlPlaneClass
metadata:
  name: capi-nico-containers-poc
spec:
  replicas:
    default: 1
    maxSurge: 1
  machine:
    machineClass: nico-container-node
    spireAttestationMethod: tpm
    infrastructureTemplatePreferences:
      - apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: NicoMachineTemplate
        spec:
          template:
            spec:
              vpcID: 00000000-0000-0000-0000-000000000002
              sshKeyGroupIDs:
                - 00000000-0000-0000-0000-000000000004
              interfaces:
                - subnetID: 00000000-0000-0000-0000-000000000003
              cloudInitInjectHostname: true
  bootstrap:
    preKubeadmCommands: []
    files: []
---
apiVersion: internal.nke.nvidia.com/v1
kind: NKECluster
metadata:
  name: nico-containers-poc
  namespace: nke-system
spec:
  apiServerAccess:
    publicAccessEnabled: false
  authentication: {}
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/12
    serviceDomain: cluster.local
  release:
    channel:
      name: nke-local-dev-kindest-arm64
      version: "1.34.2"
  controlPlaneClass: capi-nico-containers-poc
  network:
    vpcID: 00000000-0000-0000-0000-000000000002
  nodePools:
    - name: worker
      machineClass: nico-container-node
      replicas: 2
      vpcSubnetID: 00000000-0000-0000-0000-000000000003
      nodeProfile: nke-local-dev-kindest-arm64:v1
      rollout:
        strategy:
          type: RollingUpdate
          disruption:
            budgets:
              - nodes: "1"
