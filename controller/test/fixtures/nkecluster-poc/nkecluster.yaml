    maxSurge: 1
  machine:
    machineClass: nico-vms-cpu4-mem6gb-disk60gb
    spireAttestationMethod: tpm
    infrastructureTemplatePreferences:
      - apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: NicoMachineTemplate
        spec:
          template:
            spec:
              vpcID: a1b2c3d4-0002-4000-8000-000000000001
              interfaces:
                - vpcPrefixID: a1b2c3d4-0004-4000-8000-000000000001
              cloudInitInjectHostname: true
  bootstrap:
    preKubeadmCommands: []
    files: []
---
apiVersion: internal.nke.nvidia.com/v1
kind: NKECluster
metadata:
  name: nico-vms-poc
  namespace: nke-system
spec:
  apiServerAccess:
    publicAccessEnabled: false
  authentication: {}
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/12
    serviceDomain: cluster.local
  release:
    channel:
      name: nke-nico-vms-24.04-amd64-fde-live-poc
      version: "1.34.2"
  controlPlaneClass: capi-nico-poc
  network:
    vpcID: a1b2c3d4-0002-4000-8000-000000000001
  nodePools:
    - name: worker
      machineClass: nico-vms-cpu4-mem6gb-disk60gb
      replicas: 1
      vpcPrefixID: a1b2c3d4-0004-4000-8000-000000000001
      nodeProfile: nke-nico-vms-24.04-amd64-fde-live-poc:v1
