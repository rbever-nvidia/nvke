apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "controller.fullname" . }}-releases
  labels:
    {{- include "controller.labels" . | nindent 4 }}
rules:
  # Read the management-engine resources that drive release resolution and
  # tenant NKECluster reconciliation.
  - apiGroups:
      - internal.nke.nvidia.com
    resources:
      - machineimages
      - clusterreleases
      - nodepoolreleases
      - machineclasses
      - controlplaneclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - internal.nke.nvidia.com
    resources:
      - nkeclusters
    verbs:
      - get
      - list
      - watch
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "controller.fullname" . }}-releases
  labels:
    {{- include "controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "controller.fullname" . }}-releases
subjects:
  - kind: ServiceAccount
    name: {{ include "controller.serviceAccountName" . }}
    namespace: {{ include "controller.namespace" . }}
