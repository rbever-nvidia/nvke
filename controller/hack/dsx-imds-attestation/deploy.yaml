apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsx-imds-attestation-mock
  namespace: spire-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsx-imds-attestation-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsx-imds-attestation-mock
    spec:
      # Local NodePorts preserve the caller IP used to identify the mock host.
      nodeSelector:
        kubernetes.io/hostname: __MANAGEMENT_NODE__
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: imds
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - --issuer-tls-listen=:8443
            - --issuer-tls-cert=/tls/tls.crt
            - --issuer-tls-key=/tls/tls.key
          ports:
            - name: http
              containerPort: 8080
            - name: issuer
              containerPort: 8081
            - name: issuer-tls
              containerPort: 8443
          volumeMounts:
            - name: issuer-tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
      volumes:
        - name: issuer-tls
          secret:
            secretName: dsx-imds-issuer-tls
---
apiVersion: v1
kind: Service
metadata:
  name: dsx-imds-attestation-mock
  namespace: spire-server
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: dsx-imds-attestation-mock
  ports:
    - name: imds
      port: 8080
      targetPort: http
      nodePort: 30445
    - name: issuer
      port: 8081
      targetPort: issuer
      nodePort: 30446
    # kube-apiserver requires an HTTPS discovery URL for JWT authenticators.
    - name: issuer-tls
      port: 8443
      targetPort: issuer-tls
      nodePort: 30447
